<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Project NOM X 프레스 키트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Silkscreen&display=swap">
<style>
:root{--bg:#f5f6f4;--surface:#fff;--ink:#141614;--muted:#5d625e;--line:#d9ddd8;--accent:#17804f;--err:#b3261e;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-pixel:"Silkscreen","IBM Plex Sans KR",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f110f;--surface:#171a17;--ink:#eef0ec;--muted:#a3a9a3;--line:#2b302b;--accent:#43c98a;--err:#f2867e;color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.eyebrow{font:12px/1 var(--f-pixel);letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{margin:0;font-size:22px;line-height:1.3}
p{margin:0;color:var(--muted);font-size:14px}
.pwrap{position:relative;display:flex}
.pwrap input{flex:1;min-width:0;padding-right:46px}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;display:grid;place-items:center;background:none;color:var(--muted);border-radius:6px}
#eye:hover{color:var(--ink)}
#eye[aria-pressed="true"] .slash{display:none}
input{font:16px var(--f-body);padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:700 15px var(--f-body);padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--err);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">

  <label for="pw" hidden>비밀번호</label>
  <div class="pwrap">
    <input id="pw" type="password" placeholder="비밀번호" autofocus required>
    <button id="eye" type="button" aria-label="비밀번호 보기" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg></button>
  </div>
  <button id="go" type="submit">입장하기</button>
  <span class="err" id="err" aria-live="polite"></span>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  window.__NOMX_KEY=key;
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(buf);
}
function show(html){ document.open(); document.write(html); document.close(); }
const eye=document.getElementById('eye');
eye.addEventListener('click',()=>{const pwEl=document.getElementById('pw');const show=pwEl.type==='password';pwEl.type=show?'text':'password';eye.setAttribute('aria-pressed',String(show));eye.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 보기');pwEl.focus();});
const f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
let saved=null; try{saved=sessionStorage.getItem('nomx');}catch(e){}
if(saved){ open(saved).then(show).catch(()=>{try{sessionStorage.removeItem('nomx')}catch(e){}}); }
f.addEventListener('submit',async e=>{
  e.preventDefault(); go.disabled=true; err.textContent='';
  try{ const html=await open(pw.value); try{sessionStorage.setItem('nomx',pw.value)}catch(e){} show(html); }
  catch(x){ err.textContent='비밀번호가 맞지 않습니다.'; go.disabled=false; pw.select(); }
});
})();
</script>
